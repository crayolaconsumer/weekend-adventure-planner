<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf8f5;--green:#1a3a2f;--terra:#c45c3e;--u:12px}
  *{margin:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;background:var(--cream);overflow:hidden;font-family:'Fraunces',serif}
  .wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  /* vertical */
  body.v .wrap{flex-direction:column;text-align:center;gap:calc(var(--u)*3.2);padding:calc(var(--u)*9) calc(var(--u)*8)}
  /* horizontal */
  body.h .wrap{flex-direction:row;gap:calc(var(--u)*5);padding:calc(var(--u)*7) calc(var(--u)*8)}
  body.h .copy{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;gap:calc(var(--u)*2.6)}
  body.v .copy{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.8)}
  .brand{display:flex;align-items:center;gap:calc(var(--u)*1.4)}
  .brand .word{font-weight:600;color:var(--green);font-size:calc(var(--u)*4.4);letter-spacing:2px;line-height:1}
  .head{font-weight:600;color:var(--green);font-size:calc(var(--u)*8.1);line-height:1.03;letter-spacing:-2px;font-variation-settings:'opsz' 144}
  .rule{width:calc(var(--u)*10);height:calc(var(--u)*0.95);border-radius:99px;background:var(--terra)}
  .sub{font-family:'Inter',sans-serif;font-weight:500;color:#6b6f6a;font-size:calc(var(--u)*2.9);line-height:1.3;max-width:calc(var(--u)*48)}
  .cta{font-family:'Inter',sans-serif;font-weight:700;color:#fff;background:var(--green);border-radius:99px;
       padding:calc(var(--u)*1.7) calc(var(--u)*3.4);font-size:calc(var(--u)*2.7);display:inline-flex;align-items:center;gap:calc(var(--u)*1.2)}
  .phone{flex-shrink:0;background:#0f100e;border-radius:calc(var(--u)*5);padding:calc(var(--u)*1.05);
         box-shadow:0 calc(var(--u)*4.5) calc(var(--u)*9) -2.2vmin rgba(58,38,18,.5)}
  .phone .scr{border-radius:calc(var(--u)*4);overflow:hidden;display:block;background:#000}
  .phone img{display:block;width:100%}
</style></head><body>
  <div class="wrap">
    <div class="copy">
      <div class="brand">
        <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(256,256)"><circle r="180" fill="none" stroke="#1a3a2f" stroke-width="9"/><polygon points="0,-160 20,-40 -20,-40" fill="#c45c3e"/><polygon points="0,160 20,40 -20,40" fill="#1a3a2f"/><polygon points="160,0 40,20 40,-20" fill="#1a3a2f"/><polygon points="-160,0 -40,20 -40,-20" fill="#1a3a2f"/><circle r="30" fill="#c45c3e"/><circle r="14" fill="#faf8f5"/></g></svg>
        <span class="word">ROAM</span>
      </div>
      <h1 class="head" id="head">Stop scrolling.<br>Start roaming.</h1>
      <div class="rule"></div>
      <div class="sub" id="sub">Tap once and discover real places near you — parks, food, culture, nights out.</div>
      <div class="cta" id="cta">Free on iPhone &amp; Android</div>
    </div>
    <div class="phone"><div class="scr"><img id="shot" src="raw/01-discover.png" alt=""></div></div>
  </div>
<script>
  const q=new URLSearchParams(location.search);
  const cw=parseInt(q.get('w')||'1080',10), ch=parseInt(q.get('h')||'1080',10);
  document.documentElement.style.width=document.body.style.width=cw+'px';
  document.documentElement.style.height=document.body.style.height=ch+'px';
  const isH = cw/ch >= 1.4;
  document.body.classList.add(isH?'h':'v');
  const base = isH ? ch : cw;
  document.documentElement.style.setProperty('--u', (base/100)+'px');
  if(q.get('img')) document.getElementById('shot').src=q.get('img');
  if(q.has('head')) document.getElementById('head').innerHTML=q.get('head').split('|').map(l=>l.replace(/\*([^*]+)\*/g,'<span style="color:var(--terra)">$1</span>')).join('<br>');
  if(q.has('sub')) { const s=q.get('sub'); const el=document.getElementById('sub'); if(s) el.textContent=s; else el.style.display='none'; }
  if(q.has('cta')) { const c=q.get('cta'); const el=document.getElementById('cta'); if(c) el.textContent=c; else el.style.display='none'; }
  // mark size + device size
  const u = base/100;
  document.querySelector('.mark').setAttribute('width', u*4.6);
  document.querySelector('.mark').setAttribute('height', u*4.6);
  const ASPECT = 2868/1320, pad = u*1.05;
  const maxH = isH ? ch*0.92 : ch*0.5;
  const maxW = isH ? cw*0.40 : cw*0.62;
  const deviceW = Math.min(maxW, (maxH - pad*2)/ASPECT + pad*2);
  document.querySelector('.phone').style.width = deviceW+'px';
  window.__ready=false;
  Promise.all([document.fonts.ready, new Promise(r=>{const im=document.getElementById('shot'); im.complete?r():(im.onload=im.onerror=r);})]).then(()=>window.__ready=true);
</script></body></html>

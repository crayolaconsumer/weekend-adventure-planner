<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Play feature graphic, 1024x500, rendered by render-feature.mjs. Play's rules: one short
     line, focal point in the central area (edges get cropped), no device, not the logo and
     app name together (the icon sits beside it in the store), vivid, avoid "free". Query: ?bg=&card= (a real Discover screenshot; only its swipe card is shown, no device) -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,500&display=block" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:1024px; height:500px; overflow:hidden }
  .fg { position:relative; width:1024px; height:500px; overflow:hidden; display:grid; place-items:center }
  .bg { position:absolute; inset:0; background-size:cover; background-position:center 55% }
  .bg::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 46% 40% at 50% 50%, rgba(8,22,17,.5), rgba(8,22,17,0) 100%) }
  h1 { position:relative; font-family:'Newsreader',serif; font-weight:600; font-size:68px; line-height:1; letter-spacing:-.02em;
    color:#fff; text-align:center; text-shadow:0 2px 18px rgba(0,0,0,.35) }
  h1 em { font-style:italic; font-weight:500; color:#ffd9b8 }
  /* With a card: line left, card right, both inside the central 70% (x 154-870) */
  .fg.with-card { display:flex; align-items:center; justify-content:center; gap:52px }
  .fg.with-card h1 { font-size:62px; text-align:left }
  .fg.with-card .bg::after { background:radial-gradient(ellipse 36% 50% at 33% 50%, rgba(8,22,17,.72), rgba(8,22,17,0) 100%) }
  /* The .swipe-card box in a 430x932 Discover capture (measured): x 25, y 170, 380x507, radius 24. Scale 262/380 */
  .card { position:relative; width:262px; height:349px; border-radius:16.5px; overflow:hidden; transform:rotate(4deg);
    box-shadow:0 24px 50px rgba(8,22,17,.45), 0 4px 12px rgba(8,22,17,.3) }
  .card img { position:absolute; width:296.5px; left:-17.2px; top:-117.2px }
</style>
</head>
<body>
<div class="fg">
  <div class="bg" id="bg"></div>
  <h1>Things to do <em>near you.</em></h1>
  <div class="card" id="card" hidden><img id="cardimg" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  document.getElementById('bg').style.backgroundImage = `url("${q.get('bg')}")`
  if (q.get('card')) {
    document.getElementById('cardimg').src = q.get('card')
    document.getElementById('card').hidden = false
    document.querySelector('.fg').classList.add('with-card')
    document.querySelector('h1').innerHTML = 'Things to do<br><em>near you.</em>'
  }
</script>
</body>
</html>
